# sso (204):
pocket_id_encryption_key: "{{ vault_pocket_id_encryption_key }}"

# db (203): pg-main's bootstrap superuser - re-added (was removed in the
# Authentik->Pocket-ID migration since the old "db" play was unplugged) only
# for roles/db/tasks/provision_blinko.yml, which authenticates against the
# already-running pg-main container to add a "blinko" role+database. Does
# NOT re-enable the full db role/play.
pg_user_authentik: "authentik"
pg_db_authentik: "authentik"
pg_password_authentik: "{{ vault_pg_password_authentik }}"

# Bastion (201)
tls_mode: "mkcert"      # mkcert | letsencrypt
tls_cert_path: "/etc/nginx/tls/{{ gateway_domain_root }}.crt"
tls_key_path:  "/etc/nginx/tls/{{ gateway_domain_root }}.key"

nord_country: "united_states"
nord_city: "buffalo"
dns_base: /opt/dns
unbound_listen_ip: "127.0.0.1"
unbound_port: 5335
unbound_rrset_cache: "256m"
unbound_msg_cache: "128m"
unbound_root_hints: "{{ dns_base | default('/opt/dns') }}/unbound/root.hints"
tz: "America/New_York"