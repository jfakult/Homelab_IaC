# sso (204):
pocket_id_encryption_key: "{{ vault_pocket_id_encryption_key }}"
# Pocket-ID database: SQLite file on the VM (false) or the `pocketid` database
# on pg-main (true). Flip only as part of the steps in docs/postgres-migrations.md
# (the data has to be exported and imported around the switch).
pocket_id_use_postgres: true
pocket_id_db_url: "postgres://pocketid:{{ vault_pocket_id_postgres_password }}@{{ hostvars['db'].ansible_host }}:5432/pocketid?sslmode=disable"

# Monitoring VM apps: SQLite file (false) or their database on pg-main (true).
# Flip only as part of the steps in docs/postgres-migrations.md (the app creates
# its schema on the empty database, then the data is copied over).
speedtest_use_postgres: true
grafana_use_postgres: true

# db (203): pg-main, the shared Postgres container. The admin role is created
# by POSTGRES_USER at first init; every app gets its own role + database from
# pg_databases, which also drives pg_hba.conf and the UFW allow rules.
pg_version: 16
pg_listen_addr: "0.0.0.0"
pg_dir: /opt/postgres
pg_db_dir: "{{ pg_dir }}/data"
pg_backups_dir: "{{ pg_dir }}/backups"
pg_admin_user: "butlah"
pg_admin_db: "postgres"
pg_admin_password: "{{ vault_pg_admin_password }}"
pg_databases:
  - name: blinko
    owner: blinko
    # must match webapps' journal.env.j2 DATABASE_URL
    password: "{{ vault_blinko_postgres_password }}"
    cidrs:
      - 192.168.1.205/32      # webapps
      - 100.64.0.0/10         # Tailscale: ad-hoc DB client access
  - name: pocketid
    owner: pocketid
    # letters and digits only: it is embedded in a URL (pocket_id_db_url)
    password: "{{ vault_pocket_id_postgres_password }}"
    cidrs:
      - 192.168.1.204/32      # sso
  - name: speedtest
    owner: speedtest
    password: "{{ vault_speedtest_postgres_password }}"
    cidrs:
      - 192.168.1.211/32      # monitoring
  - name: grafana
    owner: grafana
    password: "{{ vault_grafana_postgres_password }}"
    cidrs:
      - 192.168.1.211/32      # monitoring
  - name: openwebui
    owner: openwebui
    # letters and digits only: it is embedded in a URL (open_webui_db_url)
    password: "{{ vault_open_webui_postgres_password }}"
    cidrs:
      - 192.168.1.208/32      # compute

# db (203): pg-immich, Immich's own Postgres container (VectorChord image; stock
# pg-main cannot host it). Same VM, own dir/port/volume. Reached only from the
# webapps VM (pg_hba + UFW). Version/port/names come from all/main.yml.
immich_pg_dir: /opt/postgres-immich
immich_pg_data_dir: "{{ immich_pg_dir }}/data"
# Exact reference from Immich's own docker-compose.yml at {{ immich_version }}
# (the digest pins what they tested). Bump together with immich_version, taking
# the new reference from the release's docker-compose.yml.
immich_pg_image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
# letters and digits only (Immich's rule; also keeps it URL-safe)
immich_db_password: "{{ vault_immich_postgres_password }}"
immich_pg_cidrs:
  - 192.168.1.205/32      # webapps
  - 100.64.0.0/10         # Tailscale: ad-hoc DB client access

# Bastion (201)
tls_mode: "mkcert"      # mkcert | letsencrypt
tls_cert_path: "/etc/nginx/tls/{{ gateway_domain_root }}.crt"
tls_key_path:  "/etc/nginx/tls/{{ gateway_domain_root }}.key"

nord_country: "united_states"
nord_city: "buffalo"
dns_base: /opt/dns
unbound_listen_ip: "127.0.0.1"
unbound_port: 5335
unbound_rrset_cache: "256m"
unbound_msg_cache: "128m"
unbound_root_hints: "{{ dns_base | default('/opt/dns') }}/unbound/root.hints"
tz: "America/New_York"