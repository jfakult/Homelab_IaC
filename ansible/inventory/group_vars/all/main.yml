gateway_domain_root: "fakult.net"

ansible_user: ubuntu
ansible_become: true
ansible_become_method: sudo

sso_fqdn: "sso.fakult.net"   # also defined in infra
pki_build_dir: "./pki-out"

pocket_id_compose_dir: "/opt/pocket-id"

nas_ip: "192.168.1.199"

# --- Public subdomains (chat.fakult.net, sso.fakult.net, ...) -------------
# Single source of truth for every "<name>.fakult.net -> some backend"
# service. Adding an entry here is the ONLY step that should ever be needed
# to stand up a new one - it drives all three consumers:
#   - roles/dns/templates/static-hosts.conf.j2   (internal LAN resolution)
#   - roles/bastion/tasks/render_subdomains.yml  (nginx vhost + TLS)
#   - roles/bastion/tasks/main.yml's certbot loop (Let's Encrypt cert)
# See docs/subdomains.md for the full add-a-subdomain walkthrough,
# including the one manual step (public DNS at your registrar) this can't
# do for you.
# Defined in all/main.yml (not external.yml) because both "dns" ([infra]
# group) and "bastion" ([external] group) need to see it, and group_vars
# files don't cross inventory groups.
subdomains:
  - name: sso
    upstream_host: "{{ hostvars['sso'].ansible_host }}"
    upstream_port: 1411
  - name: chat
    upstream_host: "{{ hostvars['compute'].ansible_host }}"
    upstream_port: 3000
  - name: speedtest
    upstream_host: "{{ hostvars['monitoring'].ansible_host }}"
    upstream_port: 3030
    aliases: [quality]       # fakult.net/quality and /quality/... also redirect here
  - name: photos
    upstream_host: "{{ hostvars['webapps'].ansible_host }}"
    upstream_port: 2283
    # Large uploads: send the body to Immich as it arrives instead of
    # spooling the whole file to the bastion's disk first.
    proxy_request_buffering: false

media_mount_opts:   "rw,hard,nconnect=8,vers=4.2,noatime,rsize=1048576,wsize=1048576,noauto,x-systemd.automount,_netdev,nofail,mount-timeout=10s,x-systemd.idle-timeout=20"
webapps_mount_opts: "rw,hard,nconnect=8,vers=4.2,noatime,rsize=1048576,wsize=1048576,noauto,x-systemd.automount,_netdev,nofail"
bastion_mount_opts: "ro,hard,nconnect=8,vers=4.2,noatime,rsize=1048576,wsize=1048576,noauto,x-systemd.automount,_netdev,nofail"


pihole_api_token: "VAULT_PIHOLE_TOKEN"

monitoring_net: "monitoring"
monitoring_dir: "/opt/monitoring"
exporters_net: "exporters"
prometheus_scrape_interval: "30s"
exporters_dir: "/opt/exporters"

# Local postfix-relay container (roles/monitoring) - relays alertmanager's
# email alerts out through Gmail. RELAYHOST_PASSWORD is a Gmail App
# Password (Google Account -> Security -> App passwords), NOT the regular
# account password - vaulted as vault_smtp_relay_password, add via
# `ansible-vault edit inventory/group_vars/all/vault.yml`.
smtp_relay_host: "[smtp.gmail.com]:587"
smtp_relay_username: "jfakult15@gmail.com"


# Prometheus jobs (targets are host:port; exporters expose on 9113, 9100, 9101-like default ports below)
prometheus_targets:
  node:        ["192.168.1.200:9100", "192.168.1.206:9100", "192.168.1.202:9100", "192.168.1.211:9100"]
  nginx:       ["192.168.1.200:9113"]
  jellyfin:    ["192.168.1.206:9594"]
  pihole:      ["192.168.1.202:9617"]
  cadvisor:    ["192.168.1.200:8080", "192.168.1.206:8080", "192.168.1.202:8080"]
  blackbox_http:
    - { target: "http://192.168.1.200",        module: "http_2xx" }
    - { target: "https://192.168.1.200",       module: "http_2xx" }
    - { target: "http://192.168.1.206:8096",     module: "http_2xx" }
    - { target: "http://192.168.1.202/admin",      module: "http_2xx" }
  blackbox_icmp:
    - { target: "192.168.1.200" }  # Bastion
    - { target: "192.168.1.206" }  # Media Server
    - { target: "192.168.1.202" }  # DNS
    - { target: "192.168.1.211" }  # Monitoring Server

# geo-proxy (webapps): reverse-geocoding proxy in front of Nominatim/OSM.
# No vault entry - Nominatim needs no API key, just a contact identifier per
# its usage policy (https://operations.osmfoundation.org/policies/nominatim/),
# reusing the address already used for SMTP alerts. Not in `subdomains` /
# `prometheus_targets` on purpose: LAN + Tailscale only, no bastion route.
geo_proxy_port: 8091
geo_proxy_contact_email: "{{ smtp_relay_username }}"

# Docker log defaults for every host (roles/misc/tasks/docker_daemon_defaults.yml).
# Override per host in host_vars/<host>.yml, or per container with a `logging:`
# block in its compose file (which always wins).
docker_log_max_size: "10m"
docker_log_max_file: 3

# Tailnet name: services that are LAN/Tailscale-only are reached at
# <inventory-name>.<tailnet_domain>.
tailnet_domain: "yak-anoles.ts.net"

# smokeping (monitoring VM, http://monitoring.<tailnet_domain>:3031/smokeping/).
# Each target becomes a graph; keep `id` stable, it names the data on disk.
smokeping_owner: "fakult"
smokeping_contact: "root@localhost"
smokeping_targets:
  - { id: Google,       menu: "Google DNS",     title: "Google DNS (8.8.8.8)",      host: "8.8.8.8" }
  - { id: Cloudflare,   menu: "Cloudflare DNS", title: "Cloudflare DNS (1.1.1.1)",  host: "1.1.1.1" }
  - { id: SanFrancisco, menu: "San Francisco",  title: "Cloudflare SFO",            host: "198.41.214.162" }
  - { id: NewYork,      menu: "New York",       title: "Cloudflare EWR",            host: "198.41.192.47" }
  - { id: Ashburn,      menu: "Ashburn VA",     title: "Cloudflare IAD",            host: "198.41.200.13" }

# speedtest-tracker (monitoring VM): how often it runs a test, as a cron
# expression in the container's timezone. Every 6 hours.
speedtest_schedule: "0 */6 * * *"

# --- Immich (photos.fakult.net) ---------------------------------------------
# server + Valkey on webapps, machine learning on compute (GPU), its own
# VectorChord Postgres container (pg-immich) on the db VM. See docs/immich.md.
# Every Immich component must run the same version: change it here and re-run
# the db (no change needed), compute and webapps plays together.
immich_version: "v3.3.3"
immich_port: 2283                 # server (webapps)
immich_ml_port: 3003              # machine learning (compute)
immich_pg_port: 5433              # pg-immich (db VM); pg-main keeps 5432
immich_db_name: immich
immich_db_user: immich
# Library on its own NAS share (Immich), mounted at /srv/photos on webapps
immich_nas_share: /mnt/user/Immich
immich_nas_mount: /srv/photos
immich_library_dir: /mnt/photos       # path inside the container (the share root)
immich_metrics_api_port: 8081
immich_metrics_worker_port: 8082
# Machine-learning models (Immich defaults). Preloaded by the ML container, and
# the same names are what the server uses unless the settings say otherwise.
immich_ml_clip_model: "ViT-B-32__openai"
immich_ml_face_model: "buffalo_l"
immich_ml_ocr_model: "PP-OCRv5_mobile"
