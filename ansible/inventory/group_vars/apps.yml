
sso_base: "https://sso.fakult.net"

jellyfin_compose_dir: "/opt/jellyfin"
jellyfin_uid: "1000"
jellyfin_gid: "1000"
jellyfin_external_scheme: "https"
jellyfin_external_host: "fakult.net"
jellyfin_base_path: "/jellyfin"     # Jellyfin -> Dashboard -> Advanced -> Base URL
jellyfin_oidc:
  client_id: "to_fill_after_provider"
  client_secret: "to_fill_after_provider"
  scopes: "openid profile email groups"
  discovery_url: "{{ sso_base }}/.well-known/openid-configuration"
media_paths:
  root_media: "/srv/media/"
  root_media_array: "/srv/nas/"      # optional, for larger media collections
  root_config: "/srv/config/"        # global config, contains cache, jellyfin config, and metadata
  #movies: "/srv/media/Movies"
  #tv:     "/srv/media/TV"
  config: "{{ media_paths.root_config }}jellyfin/config"
  cache:  "{{ media_paths.root_config }}jellyfin/cache"
  metadata: "{{ media_paths.root_config }}jellyfin/metadata"
## optional extras (omit if you don't want them)
#jellyfin_fonts_dir: "/srv/fonts"
#jellyfin_extra_hosts:
#  - "host.docker.internal:host-gateway"

blinko_nextauth_secret: "{{ vault_blinko_nextauth_secret }}"
blinko_postgres_password: "{{ vault_blinko_postgres_password }}"

# --- AI infra (Ollama + Whisper on the "compute" VM, 192.168.1.208 - the
# only host with GPU passthrough) - shared between the compute role (which
# installs/pulls these) and the webapps role (which points blinko-journal at
# them). Single source of truth: change a model here, re-run both plays. ---
ollama_base_url: "http://192.168.1.208:11434"
ollama_chat_model: "llama3.1"
ollama_embedding_model: "nomic-embed-text"
ollama_vision_model: "llava"

# Whisper reached over the LAN (not Docker DNS - see
# docs/workstreams/02-whisper-service.md in blinko-journal for why the
# same-host co-location the repo originally assumed doesn't apply here).
whisper_base_url: "http://192.168.1.208:8000/v1"
whisper_model: "Systran/faster-whisper-medium"

# Open WebUI (chat UI, fakult.net/chat) - SSO'd via Pocket-ID. client_id
# isn't secret but the secret half is vaulted. See the compute role's
# setup instructions for creating the Pocket-ID OAuth client by hand -
# this can't be provisioned by Ansible, Pocket-ID has no admin API/CLI
# for it as of this writing.
open_webui_oidc_client_id: "{{ vault_open_webui_oidc_client_id }}"
open_webui_oidc_client_secret: "{{ vault_open_webui_oidc_client_secret }}"