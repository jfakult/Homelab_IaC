# Provisions a role+database for blinko-journal inside the existing pg-main
# container on this host (currently Authentik-only). Deliberately NOT part
# of roles/db/tasks/main.yml (that whole role is unplugged from site.yml
# since the Authentik->Pocket-ID migration - re-running it would need vars
# that no longer exist and would re-template/restart pg-main unnecessarily).
# This task file only adds a new role/db + one pg_hba.conf line + one UFW
# rule, and reloads Postgres config in place (no container restart, no
# disruption to the running Authentik connections).

- name: Install DB client + driver (idempotent, likely already present)
  apt:
    name:
      - postgresql-client
      - python3-psycopg2
    state: present
    update_cache: true

- name: Ensure blinko role exists
  community.postgresql.postgresql_user:
    name: blinko
    # blinko_postgres_password (group_vars/apps.yml) isn't visible here -
    # "db" is in the [infra] inventory group, not [apps]. Reference the
    # vault var directly instead (group_vars/all/vault.yml applies to every
    # host); this must resolve to the same value webapps' journal.env.j2
    # uses for DATABASE_URL, or the app can't authenticate.
    password: "{{ vault_blinko_postgres_password }}"
    login_host: 127.0.0.1
    login_user: "{{ pg_user_authentik }}"
    login_password: "{{ pg_password_authentik }}"
    port: 5432
    state: present

- name: Ensure blinko database exists
  community.postgresql.postgresql_db:
    name: blinko
    owner: blinko
    login_host: 127.0.0.1
    login_user: "{{ pg_user_authentik }}"
    login_password: "{{ pg_password_authentik }}"
    port: 5432
    state: present

- name: Allow blinko role to connect from the webapps VM
  lineinfile:
    path: /opt/postgres/conf/pg_hba.conf
    insertbefore: '^# local$'
    line: "host    blinko   blinko   192.168.1.205/32   md5"
  register: _pg_hba_blinko

# 2026-09-16, user request: ad-hoc access for connecting to the blinko DB
# by hand over Tailscale (e.g. a local DB client), not app traffic - that
# still goes over LAN via the rule above. 100.64.0.0/10 is the whole
# Tailscale CGNAT range (see roles/dns's NordVPN-whitelist task for the
# same range used elsewhere) - deliberately the whole tailnet rather than
# one peer IP, per explicit user instruction, not scoped to a single
# device.
- name: Allow blinko role to connect from Tailscale
  lineinfile:
    path: /opt/postgres/conf/pg_hba.conf
    insertbefore: '^# local$'
    line: "host    blinko   blinko   100.64.0.0/10   md5"
  register: _pg_hba_blinko_ts

- name: Reload Postgres config (picks up the new pg_hba.conf lines, no restart)
  # PGPASSWORD must be forwarded into the container via `docker exec -e`,
  # not just set on the ansible/host-side shell process's own environment -
  # `docker exec` doesn't inherit the caller's env into the container.
  # -h 127.0.0.1 matters: without it psql uses the container's local unix
  # socket, which matches a *different* pg_hba.conf line ("local all all
  # peer") than intended - confirmed live that pg_reload_conf() run this way
  # doesn't reliably take effect (the newly-added blinko pg_hba line sat
  # unloaded until reloaded by hand over TCP instead).
  shell: >
    docker exec -e PGPASSWORD={{ pg_password_authentik }} pg-main
    psql -h 127.0.0.1 -U {{ pg_user_authentik }} -d {{ pg_db_authentik }} -c "SELECT pg_reload_conf();"
  when: _pg_hba_blinko is changed or _pg_hba_blinko_ts is changed

- name: Allow Postgres from the webapps VM (UFW)
  ufw:
    rule: allow
    port: "5432"
    proto: tcp
    src: "192.168.1.205"

- name: Allow Postgres from Tailscale (UFW)
  ufw:
    rule: allow
    port: "5432"
    proto: tcp
    src: "100.64.0.0/10"
