- name: Create dirs
  file:
    path: "{{ pocket_id_compose_dir }}/data"
    state: directory
    mode: "0750"
    owner: 1000
    group: 1000

- name: Drop compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ pocket_id_compose_dir }}/docker-compose.yml"
    mode: "0644"

- name: Up Pocket ID
  shell: docker compose up -d
  args: { chdir: "{{ pocket_id_compose_dir }}" }

- name: Wait for Pocket ID healthy
  shell: >
    docker inspect -f '{{ '{{' }}.State.Health.Status{{ '}}' }}' pocket-id
  register: _pid_health
  until: _pid_health.stdout == "healthy"
  retries: 10
  delay: 3
  changed_when: false
