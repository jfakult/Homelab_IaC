- name: Create dirs
  file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: 1000
    group: 1000
  loop:
    - "{{ pocket_id_compose_dir }}/data"
    - "{{ pocket_id_compose_dir }}/certs"

- name: Copy cert + key for Pocket ID TLS
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: 1000
    group: 1000
  loop:
    - src: "{{ pki_build_dir }}/fullchain-{{ sso_fqdn }}.pem"
      dest: "{{ pocket_id_compose_dir }}/certs/fullchain.pem"
      mode: "0644"
    - src: "{{ pki_build_dir }}/{{ sso_fqdn }}.key"
      dest: "{{ pocket_id_compose_dir }}/certs/privkey.pem"
      mode: "0600"
  tags: [pki]

- name: Drop compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ pocket_id_compose_dir }}/docker-compose.yml"
    mode: "0644"

- name: Up Pocket ID
  shell: docker compose up -d
  args: { chdir: "{{ pocket_id_compose_dir }}" }

- name: Wait for Pocket ID healthy
  shell: >
    docker inspect -f '{{ '{{' }}.State.Health.Status{{ '}}' }}' pocket-id
  register: _pid_health
  until: _pid_health.stdout == "healthy"
  retries: 10
  delay: 3
  changed_when: false
