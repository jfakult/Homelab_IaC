# blinko-egress gets explicit ACCEPT rules for LAN + Tailscale (every real
# destination it needs day-to-day: Ollama/Whisper on "compute", Postgres on
# "db", Pocket-ID/reverse-proxy on "bastion") but, unlike compute-lan, no
# DROP-all after them - WAN stays open. Deliberate, not an oversight:
# blinko-journal's embedding pipeline calls out to api.unstructured.io to
# parse non-text attachments (anything that isn't .pdf/.docx/.txt/.csv/an
# image falls through to it - confirmed live, including audio attachments,
# which it can't usefully transcribe anyway but that's a separate app-code
# gap, not a firewall one). Confirmed live: LAN/Tailscale-only broke this
# outright (DNS ENOTFOUND for api.unstructured.io from inside the
# container). Same reasoning as searxng's WAN exception on "compute".
# Run after the compose stack is up so the blinko-egress network exists.

- name: Install iptables-persistent (non-interactively)
  apt:
    name: iptables-persistent
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Inspect blinko-egress network subnet
  command: >
    docker network inspect blinko-egress
    -f '{{ "{{" }} (index .IPAM.Config 0).Subnet {{ "}}" }}'
  register: _blinko_egress_subnet
  changed_when: false

- name: Allow blinko-egress -> LAN
  command: >
    iptables -C DOCKER-USER -s {{ _blinko_egress_subnet.stdout }} -d 192.168.1.0/24 -j ACCEPT
  register: _rule_lan
  failed_when: false
  changed_when: false

- name: Insert blinko-egress -> LAN rule
  command: >
    iptables -I DOCKER-USER -s {{ _blinko_egress_subnet.stdout }} -d 192.168.1.0/24 -j ACCEPT
  when: _rule_lan.rc != 0

- name: Allow blinko-egress -> Tailscale
  command: >
    iptables -C DOCKER-USER -s {{ _blinko_egress_subnet.stdout }} -d 100.64.0.0/10 -j ACCEPT
  register: _rule_ts
  failed_when: false
  changed_when: false

- name: Insert blinko-egress -> Tailscale rule
  command: >
    iptables -I DOCKER-USER -s {{ _blinko_egress_subnet.stdout }} -d 100.64.0.0/10 -j ACCEPT
  when: _rule_ts.rc != 0

- name: Check for a stale blinko-egress DROP-all rule (from before the WAN exception)
  command: >
    iptables -C DOCKER-USER -s {{ _blinko_egress_subnet.stdout }} -j DROP
  register: _rule_drop
  failed_when: false
  changed_when: false

- name: Remove stale blinko-egress DROP-all rule
  command: >
    iptables -D DOCKER-USER -s {{ _blinko_egress_subnet.stdout }} -j DROP
  when: _rule_drop.rc == 0

- name: Persist iptables rules
  community.general.iptables_state:
    state: saved
    path: /etc/iptables/rules.v4
