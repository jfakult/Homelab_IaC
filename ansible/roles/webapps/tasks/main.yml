- name: Install NPM/Node 22 and fastapi
  apt:
    name:
      - nodejs
      - npm
      - python3-fastapi
      - python3-uvicorn
    state: present
    update_cache: yes
  tags: test

- name: Ensure webapp directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - /srv/webapps

- name: Mount NAS Webapp Share
  import_tasks: ../../misc/tasks/install_nas_reqs.yml
  vars:
    local_mount_path: /srv/www
    nas_share_path: /mnt/user/Server_WebappsCache
    mount_opts: "{{ webapps_mount_opts }}"

- name: Mount NAS Media Share
  import_tasks: ../../misc/tasks/install_nas_reqs.yml
  vars:
    local_mount_path: /srv/nas
    nas_share_path: /mnt/user/Server_WebappsArray
    mount_opts: "{{ webapps_mount_opts }}"

- name: Mount NAS Photos Share (Immich library)
  import_tasks: ../../misc/tasks/install_nas_reqs.yml
  vars:
    local_mount_path: "{{ immich_nas_mount }}"
    nas_share_path: "{{ immich_nas_share }}"
    mount_opts: "{{ webapps_mount_opts }}"
  tags: [immich, nas]

- name: Ensure kiwix directory
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - /opt/kiwix

- name: Drop Kiwix compose
  template:
    src: docker-compose-kiwix.yml.j2
    dest: /opt/kiwix/docker-compose.yml
    mode: "0644"
  tags: kiwix
  notify: Restart kiwix docker

- name: Check if kiwix container is running
  command: docker ps --filter "name=kiwix" --filter "status=running" --format "{{'{{.Names}}'}}"
  register: kiwix_ps
  changed_when: false
  tags: kiwix

- name: Bring up kiwix stack
  shell: docker compose up -d
  args:
    chdir: /opt/kiwix
  tags: kiwix
  when: kiwix_ps.stdout == ""

# NAS safeguards: bounded boot wait for the NFS mounts, watchdog, and
# docker-autoheal (kiwix: stale NAS NFS handles - see its compose healthcheck)
- name: NAS resilience (boot ordering, watchdog, autoheal)
  import_tasks: ../../misc/tasks/nas_resilience.yml
  tags: [kiwix, nas]

- name: Immich (photo library)
  import_tasks: immich.yml
  tags: immich

- name: Ensure journal directory
  file:
    path: "/opt/journal"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: journal

- name: Ensure blinko-journal data directory exists (bind mount target)
  file:
    path: "/home/{{ ansible_user }}/blinko-journal/.blinko"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
    recurse: true
  tags: journal

- name: Drop journal .env
  template:
    src: journal.env.j2
    dest: /opt/journal/.env
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  tags: journal
  notify: Restart journal docker

- name: Drop journal compose (prod)
  template:
    src: docker-compose-journal-prod.yml.j2
    dest: /opt/journal/docker-compose.yml
    mode: "0644"
  tags: journal
  notify: Restart journal docker

- name: Drop journal compose (network overlay)
  template:
    src: docker-compose-journal-network.yml.j2
    dest: /opt/journal/docker-compose-network.yml
    mode: "0644"
  tags: journal
  notify: Restart journal docker

- name: Pull latest journal image
  shell: docker compose pull
  args:
    chdir: /opt/journal
  tags: journal
  changed_when: false

- name: Bring up journal stack (prod + network overlay)
  shell: docker compose -f docker-compose.yml -f docker-compose-network.yml up -d
  args:
    chdir: /opt/journal
  tags: journal

- name: Restrict blinko-egress to LAN/Tailscale
  import_tasks: firewall.yml
  tags: journal

- name: Ensure geo-proxy directory
  file:
    path: /opt/geo-proxy
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: geo-proxy

- name: Drop geo-proxy app script
  copy:
    src: geo_proxy_app.py
    dest: /opt/geo-proxy/geo_proxy_app.py
    mode: "0644"
  tags: geo-proxy
  notify: Restart geo-proxy docker

- name: Drop geo-proxy compose
  template:
    src: docker-compose-geo-proxy.yml.j2
    dest: /opt/geo-proxy/docker-compose.yml
    mode: "0644"
  tags: geo-proxy
  notify: Restart geo-proxy docker

- name: Pull geo-proxy image
  shell: docker compose pull
  args:
    chdir: /opt/geo-proxy
  tags: geo-proxy
  changed_when: false

- name: Bring up geo-proxy stack
  shell: docker compose up -d
  args:
    chdir: /opt/geo-proxy
  tags: geo-proxy

- name: Move full pull script to /srv
  template:
    src: full_pull.sh.yml.j2
    dest: /opt/journal/full_pull.sh
    mode: "0755"

- name: Drop webappctl, gen and cleanup scripts
  copy:
    src: "{{ item.src }}"
    dest: "/srv/{{ item.dest }}"
    mode: "0755"
  loop:
    - { src: webappctl.sh, dest: webappctl.sh }
    - { src: generate_web_daemons.sh, dest: generate_web_daemons.sh }
    - { src: cleanup_web_daemons.sh, dest: cleanup_web_daemons.sh }

# One-way backup mirror of the live apps (/srv/webapps, local disk) to the NAS
# copy at /srv/www/_webapps, every 3h. Local wins; nothing is deleted on the NAS.
- name: Drop webapps NAS sync script
  copy:
    src: sync_webapps_to_nas.sh
    dest: /srv/sync_webapps_to_nas.sh
    mode: "0755"
  tags: webapps-sync

- name: Drop webapps NAS sync systemd units
  copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - webapps-nas-sync.service
    - webapps-nas-sync.timer
  tags: webapps-sync

- name: Enable webapps NAS sync timer
  systemd:
    name: webapps-nas-sync.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: webapps-sync

- name: Drop context.md into the NAS webapps mirror
  copy:
    src: webapps_nas_context.md
    dest: /srv/www/_webapps/context.md
    owner: "1000"
    group: "100"
    mode: "0644"
  tags: webapps-sync

# Nightly jobpipe run (script lives on the NAS share, not in git/Ansible)
- name: Drop jobpipe systemd units
  copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - jobpipe.service
    - jobpipe.timer
  tags: jobpipe

- name: Enable jobpipe timer
  systemd:
    name: jobpipe.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: jobpipe

# Webapps must be added manually. They are not on the NAS.
- name: Run webappctl scan
  command: /srv/webappctl.sh scan

- name: Start webapps
  command: /srv/webappctl.sh start