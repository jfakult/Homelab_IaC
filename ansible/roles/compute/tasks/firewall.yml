# Restricts the `compute-lan` Docker network (Ollama, Whisper, Open WebUI)
# to LAN + Tailscale, blocking WAN - same DOCKER-USER pattern as
# roles/webapps/tasks/firewall.yml, but with a fixed subnet instead of an
# inspected one, since compute-lan's subnet is pinned at network-creation
# time (see roles/compute/tasks/main.yaml) rather than Docker-assigned.
#
# searxng is deliberately NOT on this network and therefore NOT covered by
# these rules - it keeps normal, unrestricted egress, since it's the one
# service on this host that has to reach the open internet to function.

- name: Install iptables-persistent (non-interactively)
  apt:
    name: iptables-persistent
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Allow compute-lan -> LAN
  command: iptables -C DOCKER-USER -s {{ compute_lan_subnet }} -d 192.168.1.0/24 -j ACCEPT
  register: _rule_lan
  failed_when: false
  changed_when: false

- name: Insert compute-lan -> LAN rule
  command: iptables -I DOCKER-USER -s {{ compute_lan_subnet }} -d 192.168.1.0/24 -j ACCEPT
  when: _rule_lan.rc != 0

- name: Allow compute-lan -> Tailscale
  command: iptables -C DOCKER-USER -s {{ compute_lan_subnet }} -d 100.64.0.0/10 -j ACCEPT
  register: _rule_ts
  failed_when: false
  changed_when: false

- name: Insert compute-lan -> Tailscale rule
  command: iptables -I DOCKER-USER -s {{ compute_lan_subnet }} -d 100.64.0.0/10 -j ACCEPT
  when: _rule_ts.rc != 0

- name: Drop everything else from compute-lan
  command: iptables -C DOCKER-USER -s {{ compute_lan_subnet }} -j DROP
  register: _rule_drop
  failed_when: false
  changed_when: false

- name: Insert compute-lan DROP-all rule (must stay last)
  command: iptables -A DOCKER-USER -s {{ compute_lan_subnet }} -j DROP
  when: _rule_drop.rc != 0

- name: Persist iptables rules
  community.general.iptables_state:
    state: saved
    path: /etc/iptables/rules.v4

# Ollama's registry and Hugging Face's CDN (Whisper model downloads) both
# sit behind rotating CDN IPs, so a static IP allowlist would silently go
# stale - and a hostname-aware filtering proxy is exactly the "more moving
# parts, more to maintain long-term" tradeoff this project has already
# rejected elsewhere (see blinko-journal's docs/workstreams/07-network-hardening.md).
# A deliberate, temporary toggle instead - see the script's own header.
- name: Drop WAN-egress toggle script
  template:
    src: toggle-wan-egress.sh.j2
    dest: /opt/toggle-wan-egress.sh
    mode: "0700"
    owner: root
    group: root
