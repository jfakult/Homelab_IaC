- name: Create dirs
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/nginx
    - /etc/nginx/conf.d
    - /etc/nginx/conf.d/subdomains
    - /etc/nginx/snippets
    - /etc/nginx/tls
    - "{{ ssl_dir }}"
    - /var/log/nginx
    - /opt/gateway
    - /srv/files
    - /srv/webapps
    #- /srv/www
    #- /srv/nas
    #- /srv/share

- name: Check if cert already exists
  stat:
    path: "{{ ssl_cert }}"
  register: cert_stat

- name: Generate self-signed cert (if missing)
  command: >
    openssl req -x509 -nodes -newkey rsa:4096
    -subj "/CN={{ domain_name }}"
    -days 365
    -keyout {{ ssl_key }}
    -out {{ ssl_cert }}
  args:
    creates: "{{ ssl_cert }}"
  when: not cert_stat.stat.exists

- name: Push nginx configs
  template:
    src: "{{ item.src }}"
    dest: "/etc/nginx/{{ item.path | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: '0644'
    force: yes
  with_filetree: "templates/nginx/"
  when:
    - item.state == 'file'
    # These two are rendered separately (render_subdomains.yml) - they need
    # per-item loop vars (subdomain, cert_exists) that don't exist in this
    # blanket push's context, so a straight 1:1 copy here would fail on the
    # undefined vars. Keeping them physically alongside the other conf.d/
    # and snippets/ files (rather than out of the nginx/ tree entirely) for
    # discoverability - this exclusion is what makes that safe.
    - item.path not in ['conf.d/subdomain.conf.j2', 'snippets/subdomain-redirects.conf.j2']
  notify: Reload nginx
  tags: nginx

- name: Render subdomain vhosts (bootstrap pass - HTTP-only for any subdomain without a cert yet)
  import_tasks: render_subdomains.yml
  tags: nginx

- name: Drop compose
  template:
    src: docker-compose.yml.j2
    dest: /opt/gateway/docker-compose.yml
    mode: "0644"
  notify: Reload nginx docker
  tags: nginx

- name: Check if rp-nginx container is running
  command: docker ps --filter "name=rp-nginx" --filter "status=running" --format "{{'{{.Names}}'}}"
  register: rp_nginx_ps
  changed_when: false

- name: Bring up gateway stack
  shell: docker compose up -d
  args:
    chdir: /opt/gateway
  when: rp_nginx_ps.stdout == ""

- name: Wait for nginx listening on 80
  wait_for:
    host: "{{ ansible_host }}"   # or {{ ansible_host }}
    port: 80
    delay: 2
    timeout: 120
  tags: nginx

- name: Validate nginx syntax (post-start)
  shell: docker exec rp-nginx nginx -t
  register: ngchk
  failed_when: ngchk.rc != 0
  tags: nginx
  changed_when: false

- name: Mount NAS Webapp Share
  import_tasks: ../../misc/tasks/install_nas_reqs.yml
  vars:
    local_mount_path: /srv/www
    nas_share_path: /mnt/user/Server_WebappsCache
    mount_opts: "{{ bastion_mount_opts }}"

- name: Mount NAS Webapp Share
  import_tasks: ../../misc/tasks/install_nas_reqs.yml
  vars:
    local_mount_path: /srv/nas
    nas_share_path: /mnt/user/Server_WebappsArray
    mount_opts: "{{ bastion_mount_opts }}"

- name: Mount NAS Public Share
  import_tasks: ../../misc/tasks/install_nas_reqs.yml
  vars:
    local_mount_path: /srv/share
    nas_share_path: /mnt/user/Public
    mount_opts: "{{ bastion_mount_opts }}"



- name: Install certbot and nginx plugin
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: yes
  become: yes
  tags: certbot

- name: Ensure ACME webroot exists
  ansible.builtin.file:
    path: /var/www/letsencrypt
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  become: yes
  tags: certbot

# -d {{ certbot_domains | join(' -d ') }}

- name: Issue/renew certificate for {{ certbot_primary_domain }}
  ansible.builtin.command: >
    certbot certonly
    --webroot
    --webroot-path /var/www/letsencrypt
    -d {{ certbot_domains | join(' -d ') }}
    --agree-tos
    -m {{ certbot_email }}
    --non-interactive
    --keep-until-expiring
  args:
    creates: "/etc/letsencrypt/live/{{ certbot_primary_domain }}/fullchain.pem"
  become: yes
  tags: certbot

# Every entry in `subdomains` (group_vars/all/main.yml) gets its own
# single-domain cert, not folded into the primary domain's SAN cert above -
# confirmed against the real host that fakult.net and sso.fakult.net are
# already two independent cert lineages (`certbot certificates`), not one
# combined cert, so this matches how it actually works rather than how the
# old (dead) combined-list task implied it worked.
- name: Issue/renew certificate for each subdomain
  ansible.builtin.command: >
    certbot certonly
    --webroot
    --webroot-path /var/www/letsencrypt
    --cert-name {{ item.name }}.{{ domain_name }}
    -d {{ item.name }}.{{ domain_name }}
    --agree-tos
    -m {{ certbot_email }}
    --non-interactive
    --keep-until-expiring
  args:
    creates: "/etc/letsencrypt/live/{{ item.name }}.{{ domain_name }}/fullchain.pem"
  loop: "{{ subdomains }}"
  loop_control:
    label: "{{ item.name }}.{{ domain_name }}"
  become: yes
  tags: certbot

- name: Render subdomain vhosts (activation pass - picks up certs issued just above)
  import_tasks: render_subdomains.yml
  tags: [nginx, certbot]

- name: Validate nginx syntax (final, post-cert)
  shell: docker exec rp-nginx nginx -t
  register: ngchk_final
  failed_when: ngchk_final.rc != 0
  changed_when: false
  tags: [nginx, certbot]

- name: Reload nginx (final, post-cert)
  # docker restart, not `nginx -s reload` - see roles/bastion/handlers/main.yml
  shell: docker restart rp-nginx
  changed_when: false
  tags: [nginx, certbot]
