# roles/bastion/handlers/main.yml
- name: Reload nginx
  # `nginx -s reload` (SIGHUP) doesn't reliably pick up conf.d/snippets
  # changes in this container - full restart instead. Brief (~1-2s) full
  # outage for everything behind bastion, not just whatever changed.
  shell: docker restart rp-nginx
  ignore_errors: true

- name: Reload nginx docker
  # restart rp-nginx with the new compose file
  shell: docker compose up -d
  args: { chdir: /opt/gateway }
  ignore_errors: true

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
  become: yes