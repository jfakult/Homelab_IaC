# Safeguards for hosts that mount the NAS over NFS. Include with:
#   vars: { nas_mount_paths: [/srv/www, /srv/nas] }
# - nas-wait.service   orders Docker after the NAS mounts (bounded wait)
# - nas-watchdog.timer remounts dead mounts, restarts containers holding a
#                      stale/empty view of them
# - docker-autoheal    restarts containers labelled autoheal=true when their
#                      healthcheck or log pattern says a NAS read failed
- name: Drop NAS resilience config
  template:
    src: "{{ playbook_dir }}/roles/misc/templates/nas-resilience.conf.j2"
    dest: /etc/nas-resilience.conf
    mode: "0644"

- name: Drop nas-wait.service
  template:
    src: "{{ playbook_dir }}/roles/misc/templates/nas-wait.service.j2"
    dest: /etc/systemd/system/nas-wait.service
    mode: "0644"

- name: Drop NAS resilience / autoheal scripts
  copy:
    src: "{{ playbook_dir }}/roles/misc/files/{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0755"
  loop:
    - nas-wait.sh
    - nas-watchdog.sh
    - docker-autoheal.sh

- name: Drop NAS resilience systemd units
  copy:
    src: "{{ playbook_dir }}/roles/misc/files/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - nas-watchdog.service
    - nas-watchdog.timer
    - docker-autoheal.service
    - docker-autoheal.timer

- name: Docker drop-in dir
  file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Order Docker after nas-wait
  copy:
    src: "{{ playbook_dir }}/roles/misc/files/docker-nas-order.conf"
    dest: /etc/systemd/system/docker.service.d/10-nas-order.conf
    mode: "0644"

- name: Enable NAS wait (runs at boot only)
  systemd:
    name: nas-wait.service
    enabled: true
    daemon_reload: true

- name: Enable NAS watchdog and autoheal timers
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nas-watchdog.timer
    - docker-autoheal.timer
