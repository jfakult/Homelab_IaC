- name: Remove conflicting Ubuntu-native Docker packages
  # docker-compose-plugin (Docker's official repo) and docker-compose-v2
  # (Ubuntu's own package) both ship /usr/libexec/docker/cli-plugins/docker-compose
  # with no Conflicts/Replaces between them, so installing docker-ce
  # alongside a pre-existing Ubuntu-packaged Docker fails dpkg with an
  # "overwrite" error. Purge the Ubuntu-native set first (per Docker's own
  # "uninstall old versions" guidance) - safe no-op on hosts that never had
  # them (a fresh VM), which is every host except "compute" as of this
  # writing.
  apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Docker Install prerequisites
  package:
    name: [ "ca-certificates", "curl", "gnupg", "lsb-release" ]
    state: present

- name: Add Docker apt key
  apt_key:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: "deb https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
    update_cache: yes


- name: Install Docker & compose plugin
  package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Enable Docker
  service:
    name: docker
    enabled: true
    state: started
