---

- include_tasks: keyboard.yml

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags: hostname

- name: Deploy /etc/hosts
  template:
    src: ../../misc/templates/hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'

# Skipped on the dns host itself - confirmed live (2026-09-17) its
# /etc/resolv.conf is deliberately chattr +i'd (immutable) pointing at
# 127.0.0.1, not 192.168.1.202 (itself, over the network stack, which
# would be redundant) - roles/dns/tasks/main.yml owns that file and
# fails this template task with EPERM otherwise.
- name: Deploy /etc/resolv.conf
  template:
    src: ../../misc/templates/resolv.conf
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname != 'dns'

- name: Stat tailscale binary
  ansible.builtin.stat:
    path: /usr/sbin/tailscale
  register: tailscale_bin
  tags: tailscale

- name: Install tailscale via script if missing or older than 30 days
  ansible.builtin.shell: |
    curl -fsSL https://tailscale.com/install.sh | sh
  when: >
    not tailscale_bin.stat.exists
    or (ansible_date_time.epoch | int - tailscale_bin.stat.mtime | int) > (30 * 86400)
  tags: tailscale

- name: Stat tailscale state file
  ansible.builtin.stat:
    path: /var/lib/tailscale/tailscaled.state
  register: tailscale_state
  tags: tailscale

- name: Delete tailscale state if empty
  ansible.builtin.file:
    path: /var/lib/tailscale/tailscaled.state
    state: absent
  when:
    - tailscale_auth_key is defined
    - tailscale_state.stat.exists
    - tailscale_state.stat.size <= 2
  tags: tailscale

- name: Bring tailscale up using pre-shared key
  ansible.builtin.shell: |
    tailscale up --authkey {{ tailscale_auth_key }} --hostname {{ inventory_hostname }}
  args:
    creates: /var/lib/tailscale/tailscaled.state
  when: tailscale_auth_key is defined
  tags: tailscale

# Tailscale's accept-dns defaults to true, which makes it manage
# /etc/resolv.conf itself ("generated by tailscale... DO NOT EDIT") and
# silently overwrite the template pushed above on every DNS change/periodic
# re-check - confirmed live (2026-09-17): the "Deploy /etc/resolv.conf" task
# above already correctly pins 192.168.1.202 (Pi-hole) first, but every VM's
# live file showed 100.100.100.100 (Tailscale MagicDNS) instead, clobbered
# after the fact. The dns role already disables this for itself; doing the
# same here for every other host makes the ansible-pushed resolv.conf
# actually stick, scoped per-VM (not a tailnet-wide admin console setting -
# other, non-VM tailnet devices are unaffected either way).
- name: Disable tailscale's DNS management so our resolv.conf sticks
  ansible.builtin.command: tailscale set --accept-dns=false
  changed_when: false
  tags: tailscale