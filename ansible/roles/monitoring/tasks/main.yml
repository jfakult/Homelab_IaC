# Make /opt/monitoring directory
- name: Create monitoring base directory
  file:
    path: "{{ monitoring_dir }}"
    state: directory
    mode: '0755'

- name: Create monitoring directory
  file:
    path: "{{ monitoring_dir }}/{{ item }}"
    state: directory
    mode: '0775'
  loop:
    - alertmanager
    - blackbox
    - loki
    - loki-data
    - prometheus
    - prometheus-data

- name: Create speedtest-tracker and smokeping directories (linuxserver images run as uid 1000)
  file:
    path: "{{ monitoring_dir }}/{{ item }}"
    state: directory
    owner: 1000
    group: 1000
    mode: '0755'
  loop:
    - speedtest-tracker
    - smokeping
    - smokeping/config
    - smokeping/data

- name: Generate configs
  template:
    src: "{{ item.src }}"
    dest: "{{ monitoring_dir }}/{{ item.path | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: '0644'
    force: yes
  with_filetree: "templates/monitoring/"
  when: item.state == 'file'
  register: _monitoring_configs

- name: Fix Prometheus data directory permissions
  file:
    path: /opt/monitoring/prometheus-data
    owner: 65534
    group: 65534
    mode: "0775"
    recurse: yes

- name: Fix perms for grafana data directory
  file:
    path: /opt/monitoring/grafana
    owner: 472
    group: 472
    mode: "0775"
    recurse: yes

- name: Fix perms for loki directory
  file:
    path: /opt/monitoring/loki
    owner: 472
    group: 472
    mode: "0775"
    recurse: yes

- name: Fix perms for loki data directory
  file:
    path: /opt/monitoring/loki-data
    owner: 10001  # loki runs as uid 10001; 472 (grafana) breaks WAL writes
    group: 10001
    mode: "0775"
    recurse: yes

- name: Push monitoring docker-compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    mode: "0600"   # holds the SMTP relay password, the Grafana admin password and DB passwords

- name: Startup monitoring stack
  command: docker compose up -d
  args:
    chdir: "{{ monitoring_dir }}"

# A changed bind-mounted config file does not recreate the container.
- name: Restart smokeping when its config changed
  command: docker compose restart smokeping
  args:
    chdir: "{{ monitoring_dir }}"
  when: _monitoring_configs.results | selectattr('changed') | map(attribute='item.path') | select('match', '^smokeping/') | list | length > 0
