---
- name: Configure base settings
  hosts: all
  become: true
  become_method: sudo
  roles:
    - base
  tags:
    - base
    - tested

- name: Setup local ssl certs
  hosts: localhost
  gather_facts: false
  roles:
    - local_pki
  tags:
    - tested

# Setup critical infrastructure (SSO, Bastion). Order matters
- name: Configure SSO
  hosts: sso
  become: true
  become_method: sudo
  pre_tasks:
    - import_tasks: roles/misc/tasks/install_docker_and_compose.yml
  roles:
    - sso
  tags:
    - tested

- name: Configure Bastion
  hosts: bastion
  become: true
  become_method: sudo
  pre_tasks:
    - import_tasks: roles/misc/tasks/install_docker_and_compose.yml
  roles:
    - bastion
  tags:
    - tested

- name: Configure DNS
  hosts: dns
  become: true
  become_method: sudo
  pre_tasks:
    - import_tasks: roles/misc/tasks/install_docker_and_compose.yml
  roles:
    - dns
  tags:
    - tested

- name: Configure Media Server
  hosts: media
  become: true
  become_method: sudo
  pre_tasks:
    - import_tasks: roles/misc/tasks/install_docker_and_compose.yml
  roles:
    - media
  tags: tested

- name: Configure pg-main (Postgres) and its app databases
  hosts: db
  become: true
  become_method: sudo
  pre_tasks:
    - import_tasks: roles/misc/tasks/docker_daemon_defaults.yml
  roles:
    - db
  tags:
    - db
    - journal

- name: Configure Webapps Server
  hosts: webapps
  become: true
  become_method: sudo
  pre_tasks:
    - import_tasks: roles/misc/tasks/install_docker_and_compose.yml
  roles:
    - webapps

- name: Configure Compute Server
  hosts: compute
  become: true
  become_method: sudo
  pre_tasks:
    - import_tasks: roles/misc/tasks/install_docker_and_compose.yml
  # compute-lan (Ollama, Whisper, Open WebUI, Immich ML) has no WAN access, but
  # model pulls and downloads need it. The play opens the WAN toggle for its own
  # duration and closes it again at the end, also when a task fails.
  # (/opt/toggle-wan-egress.sh is dropped by the role itself, so on a fresh VM
  # there is nothing to open yet and nothing blocking.)
  tasks:
    - name: Compute role with WAN egress open for downloads
      block:
        - name: Is the WAN toggle script installed?
          stat:
            path: /opt/toggle-wan-egress.sh
          register: _wan_toggle
          tags: always

        - name: Open compute-lan WAN egress
          command: /opt/toggle-wan-egress.sh open
          when: _wan_toggle.stat.exists
          changed_when: false
          tags: always

        - import_role:
            name: compute
      always:
        - name: Close compute-lan WAN egress
          command: /opt/toggle-wan-egress.sh close
          when: _wan_toggle.stat is defined and _wan_toggle.stat.exists
          changed_when: false
          tags: always

- name: Configure Monitoring Server
  hosts: monitoring
  become: true
  become_method: sudo
  pre_tasks:
    - import_tasks: roles/misc/tasks/install_docker_and_compose.yml
  roles:
    - monitoring